name: macOS tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test without NAS
        run: swift test
      - name: Verify English translation coverage
        run: python3 scripts/check-localization.py
      - name: Build app
        run: zsh build-app.sh
